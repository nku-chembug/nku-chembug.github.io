site_name: 化区生存指南
site_description: 面向化区同学的学习、科研与生活 Wiki
site_url: https://nku-chembug.github.io/

repo_url: https://github.com/nku-chembug/nku-chembug.github.io
repo_name: nku-chembug.github.io
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: overrides
  language: zh
  logo: assets/chembug-logo-wordmark.png
  favicon: assets/chembug-logo-v2.png
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.action.edit
    - content.code.copy

  palette:
    - scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: 切换深色模式

    - scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: 切换浅色模式

plugins:
  - search:
      lang:
        - zh
        - en
  - awesome-nav

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax.js
  - javascripts/vendor/mathjax/tex-chtml.js
  - https://cdn.busuanzi.cc/busuanzi/3.6.9/busuanzi.min.js

extra_css:
  - stylesheets/extra.css
